name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx ng build --configuration demo --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages responde 404 en rutas internas (ej. /home al recargar).
      # Con 404.html igual a index.html, Angular resuelve la ruta.
      - name: SPA fallback
        run: cp dist/vSIAF_FE/browser/index.html dist/vSIAF_FE/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/vSIAF_FE/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
